<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EMX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&family=Exo+2:wght@300;400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#050505;--surf:#0d0808;--surf2:#160c0c;--surf3:#1f1010;
  --bord:#3d1414;--bord2:#5c1c1c;
  --acc:#ff1f3d;--acc2:rgba(255,31,61,0.14);
  --grn:#ff6b3d;--grn2:rgba(255,107,61,0.10);
  --yel:#ffc940;--yel2:rgba(255,201,64,0.12);
  --red:#ff2d55;--red2:rgba(255,45,85,0.09);
  --txt:#f0d8d8;--txtd:#7a5555;--txtm:#c08a8a;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);}
body{color:var(--txt);font-family:'Exo 2',sans-serif;min-height:100vh;position:relative;}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(255,31,61,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,31,61,0.03) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;z-index:0}

/* ===== BOARD ===== */
.board{
  border-bottom:1px solid var(--bord);
  background:linear-gradient(135deg,#0a0303,#150606,#0a0303);
  padding:22px 24px 18px;
  position:sticky; top:0; z-index:20;
  backdrop-filter:blur(6px);
  overflow:hidden;
  box-shadow:0 0 40px rgba(255,31,61,0.10),0 0 80px rgba(255,107,61,0.05);
}
.board::before{content:'';position:absolute;top:0;left:0;right:0;bottom:0;padding:1px;background:linear-gradient(135deg,var(--acc),transparent,var(--grn),transparent,var(--acc));-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.board::after{content:'';position:absolute;top:0;left:-100%;width:60%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,31,61,0.05),transparent);animation:hdrShine 4s infinite;pointer-events:none}
@keyframes hdrShine{0%{left:-100%}100%{left:200%}}
.board-top{display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;z-index:1}
.emx-logo{display:flex;align-items:center;gap:0;line-height:1}
.emx-e{font-family:'Rajdhani',sans-serif;font-size:2.2rem;font-weight:900;color:var(--acc);letter-spacing:-1.5px;text-shadow:0 0 24px var(--acc),0 0 48px rgba(255,31,61,0.5)}
.emx-m{font-family:'Rajdhani',sans-serif;font-size:2.2rem;font-weight:900;color:#fff;letter-spacing:-1.5px;text-shadow:0 0 16px rgba(255,255,255,0.4)}
.emx-x{font-family:'Rajdhani',sans-serif;font-size:2.2rem;font-weight:900;color:var(--grn);letter-spacing:-1.5px;text-shadow:0 0 24px var(--grn),0 0 48px rgba(255,107,61,0.5)}
.emx-dot{font-size:.6rem;color:var(--acc);margin-left:7px;animation:blink 1.5s infinite;align-self:center}
.emx-dot.status-connected{color:#2ed573;text-shadow:0 0 10px rgba(46,213,115,.85)}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.2}}
.board-sub{color:var(--txtd);font-family:'Share Tech Mono',monospace;font-size:11px;letter-spacing:0.2em;text-transform:uppercase;margin-top:4px}

/* ===== PAGE NAV ===== */
.page-nav{
  max-width:1100px;margin:16px auto 0;padding:12px 16px;
  background:var(--surf);border:1px solid var(--bord);border-radius:10px;
  display:flex;gap:10px;justify-content:center;flex-wrap:wrap;position:relative;z-index:1;
}
.page-nav-btn{
  display:inline-flex;align-items:center;gap:7px;padding:9px 18px;
  font-family:'Rajdhani',sans-serif;font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--txtd);background:var(--surf2);border:1px solid var(--bord2);border-radius:7px;
  text-decoration:none;transition:background .15s,color .15s,border-color .15s;cursor:pointer;
}
.page-nav-btn:hover{color:var(--txt);border-color:var(--acc)}
.page-nav-btn.active{background:var(--acc);color:#050505;border-color:var(--acc);cursor:default}

.app{position:relative;z-index:1;max-width:900px;margin:0 auto;padding:20px 14px 90px}

/* ===== LISTA: titlu + numere, tot vizibil ===== */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.cat{background:var(--surf);border:1px solid var(--bord);border-radius:12px;padding:16px 16px 18px;position:relative;overflow:hidden}
.cat::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--acc),var(--grn))}
.cat-title{font-family:'Rajdhani',sans-serif;font-weight:800;font-size:1.35rem;color:var(--acc);letter-spacing:.04em;line-height:1.1;margin-bottom:12px;overflow-wrap:anywhere}
.nums{display:flex;flex-direction:column;gap:6px}
.num{display:flex;align-items:center;width:100%;background:var(--acc2);border:1px solid rgba(255,31,61,.35);border-radius:7px;padding:6px 13px;font-family:'Share Tech Mono',monospace;font-size:1rem;color:var(--txt);letter-spacing:.04em}
.src{margin-top:26px;text-align:center;font-family:'Share Tech Mono',monospace;font-size:10.5px;color:var(--txtd);opacity:.7}
.none{font-family:'Share Tech Mono',monospace;font-size:.78rem;color:var(--txtd)}
.empty{color:var(--txtd);font-size:.85rem;text-align:center;padding:36px 10px;font-family:'Share Tech Mono',monospace;line-height:1.7}

@media(max-width:560px){.board{padding:16px 14px 14px}.app{padding:14px 10px 90px}}
@media(prefers-reduced-motion:reduce){.board::after,.emx-dot{animation:none}}
</style>
<script src="theme.js?v=3"></script>
</head>
<body>

<div class="board">
  <div class="board-top">
    <div class="emx-logo">
      <span class="emx-e">E</span><span class="emx-m">M</span><span class="emx-x">X</span>
      <span class="emx-dot" id="statusDot">●</span>
    </div>
    <div class="board-sub">NUMĂR RAME</div>
  </div>
</div>

<div class="page-nav">
  <a href="index.html" class="page-nav-btn">🏠 Acasă</a>
  <a href="fisalucru.html" class="page-nav-btn">📋 Fișă de lucru</a>
  <a href="salariu.html" class="page-nav-btn">💰 Calcul salariu</a>
  <a href="bani.html" class="page-nav-btn" id="navBani">💵 Bani de luat</a>
  <a href="intarzieri.html" class="page-nav-btn">🚆 Întârzieri</a>
  <a href="fisapontaj.html" class="page-nav-btn">📅 Pontaj</a>
  <span class="page-nav-btn active">🚂 Număr Rame</span>
</div>

<div class="app">
  <div class="grid" id="list"></div>
  <div class="empty" id="empty">Se încarcă…</div>
  <div class="src" id="src"></div>
</div>

<script>
/* am.json: { v:3, categorii:[ { id, titlu, numere:["RE 020","IR 020"] } ] }
   Se editează din pagina Acasă (admin › 🚂 Rame). Aici doar se afișează. */
const $ = id => document.getElementById(id);

function asList(v){
  if(Array.isArray(v)) return v;
  if(typeof v === 'string') return v.split(/[,;\n]/);
  return [];
}
function normalize(data){
  if(Array.isArray(data)){                          // format vechi (listă plată cu „seria”)
    const seen = [];
    data.forEach(l=>{ const t = String(l.seria||'').trim(); if(t && !seen.includes(t)) seen.push(t); });
    return seen.map(t=>({ titlu:t, numere:[] }));
  }
  const cats = (data && (data.categorii || data.categories)) || [];
  return (Array.isArray(cats) ? cats : []).map(c=>{
    // numerele pot fi în c.numere (format curent) sau, în formatele mai vechi, ca titluri de subcategorii
    let nr = asList(c.numere).concat(asList(c.numbers));
    asList(c.subcategorii).forEach(s=>{
      if(s && typeof s === 'object'){ if(s.titlu) nr.push(s.titlu); asList(s.numere).forEach(n=>nr.push(n)); }
      else if(s) nr.push(s);
    });
    const seen = {}, out = [];
    nr.forEach(n=>{ n = String(n==null?'':n).trim(); if(n && !seen[n.toLowerCase()]){ seen[n.toLowerCase()] = 1; out.push(n); } });
    return { titlu:String(c.titlu||''), numere:out };
  }).filter(c=>c.titlu.trim() || c.numere.length);
}

function el(tag, cls, text){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(text != null) e.textContent = text;
  return e;
}
function render(cats, loaded){
  const list = $('list'); list.innerHTML = '';
  cats.forEach(c=>{
    const card = el('div','cat');
    card.appendChild(el('div','cat-title',c.titlu || '—'));
    const nums = el('div','nums');
    if(!c.numere.length) nums.appendChild(el('span','none','fără numere'));
    c.numere.forEach(n=>nums.appendChild(el('span','num',n)));
    card.appendChild(nums);
    list.appendChild(card);
  });
  const em = $('empty');
  em.style.display = cats.length ? 'none' : 'block';
  em.textContent = loaded ? 'Nicio categorie încă.' : 'Se încarcă…';
}

const API = 'https://api.github.com/repos/vladynitu1/vladynitu1.github.io/contents/am.json?ref=main';
function b64dec(b){
  const raw = atob(b.replace(/\s/g,'')), by = new Uint8Array(raw.length);
  for(let i=0;i<raw.length;i++) by[i] = raw.charCodeAt(i);
  return new TextDecoder().decode(by);
}
async function fetchData(){
  // 1) direct din repo (date proaspete, fără întârzierea de publicare a site-ului)
  try{
    const h = { 'Accept':'application/vnd.github+json' };
    let tok = ''; try{ tok = localStorage.getItem('emx_gh_token') || ''; }catch(e){}
    if(tok) h.Authorization = 'token ' + tok;
    const r = await fetch(API + '&t=' + Date.now(), { headers:h, cache:'no-store' });
    if(r.ok){ const j = await r.json(); return { data:JSON.parse(b64dec(j.content)), src:'repo' }; }
  }catch(e){}
  // 2) copia publicată a site-ului
  const r = await fetch('am.json?t='+Date.now(),{cache:'no-store'});
  if(!r.ok) throw new Error('HTTP '+r.status);
  return { data:await r.json(), src:'site' };
}
async function load(silent){
  try{
    const { data, src } = await fetchData();
    const cats = normalize(data);
    render(cats, true);
    const nr = cats.reduce((n,c)=>n+c.numere.length,0);
    let up = ''; if(data && data.updated){ const d = new Date(data.updated); if(!isNaN(d)) up = ' · salvat ' + d.toLocaleString('ro-RO',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}); }
    $('src').textContent = 'am.json (' + src + '): ' + cats.length + ' categorii, ' + nr + ' numere' + up;
    $('statusDot').classList.add('status-connected');
  }catch(e){
    if(!silent){ render([], true); $('src').textContent = 'Nu am putut citi am.json (' + e.message + ')'; }
  }
}

try{ if(!localStorage.getItem('emx_gh_token')){ const nb = $('navBani'); if(nb) nb.remove(); } }catch(e){}
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') load(true); });
load();
</script>
<script src="sticky.js?v=2" defer></script>
<script src="luni.js?v=1"></script>
<script src="nume-auto.js?v=1" defer></script>
<script src="status.js?v=8" defer></script>
</body>
